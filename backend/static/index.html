<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Code Reviewer — Enterprise GitHub Pull Request Analysis SaaS powered by Groq AI.">
    <meta name="theme-color" content="#03040b">

    <title>AI Code Reviewer | Command Center</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Design System & Component Stylesheets -->
    <link rel="stylesheet" href="/static/css/design_system.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">

    <style>
        /* Inline critical styles only — body visibility gate */
        body {
            opacity: 0;
            transition: opacity 0.5s ease-out;
        }
        body.loaded { opacity: 1; }

        /* Noscript fallback */
        .noscript-warning {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 1rem;
            color: #94a3b8;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
    <noscript>
        <div class="noscript-warning">
            <h1 style="color:#ef4444;">JavaScript Required</h1>
            <p>This application requires JavaScript to run. Please enable it in your browser settings.</p>
        </div>
    </noscript>

    <!-- SPA Root Mount Point -->
    <div id="app-root" aria-label="AI Code Reviewer Application"></div>

    <!-- Toast Notification Container (managed by toast.js) -->
    <div id="toast-container" aria-live="polite" aria-label="Notifications"></div>

    <!-- Application Entry Point (ES Module) -->
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
